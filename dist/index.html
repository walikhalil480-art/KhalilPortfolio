  <meta name="theme-color" content="#283C32" />

  <!-- Synchronous theme initializer to prevent any flash of unstyled theme -->
  <script>
    (function () {
      try {
        var queryMatch = window.location.search.match(/[?&]theme=(dark|light)/);
        var savedTheme = queryMatch ? queryMatch[1] : localStorage.getItem('khalil-theme');
        if (queryMatch) {
          try { localStorage.setItem('khalil-theme', queryMatch[1]); } catch (e) {}
        }
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#121413');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
