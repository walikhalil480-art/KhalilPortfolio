<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <linearGradient id="readerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191F1C" />
      <stop offset="100%" stop-color="#121714" />
    </linearGradient>
  </defs>

  <!-- App Window Frame -->
  <rect x="0" y="0" width="800" height="520" rx="6" fill="#151A17" />
  
  <!-- Window Header Bar -->
  <rect x="0" y="0" width="800" height="38" rx="6" fill="#1C231F" />
  <circle cx="20" cy="19" r="4" fill="#E47438" opacity="0.8" />
  <circle cx="34" cy="19" r="4" fill="#CBB682" opacity="0.6" />
  <circle cx="48" cy="19" r="4" fill="#4E6759" opacity="0.6" />

  <text x="400" y="23" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#8FA498" text-anchor="middle" letter-spacing="1.5">UNDERSTORY BOOKS // DESKTOP READER v2.4</text>
  <rect x="730" y="11" width="50" height="16" rx="2" fill="#283C32" />
  <text x="755" y="22" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#C2D3C8" text-anchor="middle">ONLINE</text>

  <!-- Left Sidebar (Table of Contents) -->
  <rect x="0" y="38" width="220" height="482" fill="#18201C" />
  <line x1="220" y1="38" x2="220" y2="520" stroke="#24302A" stroke-width="1" />

  <text x="24" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#E47438" letter-spacing="1.2">TABLE OF CONTENTS</text>

  <!-- TOC Items -->
  <rect x="14" y="86" width="192" height="32" rx="3" fill="#212C26" />
  <circle cx="28" cy="102" r="2.5" fill="#E47438" />
  <text x="40" y="105" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">01. Principles of Architecture</text>

  <text x="40" y="142" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8FA498">02. Decoupled Persistence</text>
  <line x1="24" y1="158" x2="196" y2="158" stroke="#202A24" stroke-width="1" />

  <text x="40" y="180" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8FA498">03. Deterministic Sync Engines</text>
  <line x1="24" y1="196" x2="196" y2="196" stroke="#202A24" stroke-width="1" />

  <text x="40" y="218" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8FA498">04. Distributed Consensus</text>
  <line x1="24" y1="234" x2="196" y2="234" stroke="#202A24" stroke-width="1" />

  <text x="40" y="256" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8FA498">05. The Editorial Canvas</text>

  <!-- Sidebar Reading Telemetry Box -->
  <rect x="16" y="380" width="188" height="114" rx="4" fill="#131A16" stroke="#223028" stroke-width="1" />
  <text x="28" y="404" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#6E8478" letter-spacing="1">SESSION TELEMETRY</text>
  
  <text x="28" y="428" font-family="'Inter', sans-serif" font-size="9" fill="#9FB5A9">Reading Progress</text>
  <text x="180" y="428" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#E47438" text-anchor="end">78%</text>
  <!-- Progress Bar -->
  <rect x="28" y="436" width="160" height="4" rx="2" fill="#202C26" />
  <rect x="28" y="436" width="125" height="4" rx="2" fill="#E47438" />

  <text x="28" y="462" font-family="'Inter', sans-serif" font-size="9" fill="#9FB5A9">Avg. Sync Latency</text>
  <text x="180" y="462" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="end">14ms</text>

  <text x="28" y="482" font-family="'Inter', sans-serif" font-size="9" fill="#9FB5A9">Cache Integrity</text>
  <text x="180" y="482" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#99C9AB" text-anchor="end">Verified 100%</text>

  <!-- Main Editorial Reading Canvas -->
  <rect x="250" y="58" width="520" height="438" rx="4" fill="#FAF6ED" filter="url(#cardShadow)" />

  <!-- Canvas Header -->
  <text x="280" y="90" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#9A4D2E" letter-spacing="1.5">UNDERSTORY PRESS // ESSAY ARCHIVE</text>
  <text x="740" y="90" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#88857C" text-anchor="end">P. 142 — 156</text>
  <line x1="280" y1="102" x2="740" y2="102" stroke="#E5DEC9" stroke-width="1" />

  <!-- Essay Title -->
  <text x="280" y="136" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#1B1C1A" letter-spacing="-0.3">The Morphology of Distributed Systems</text>
  <text x="280" y="156" font-family="'Newsreader', Georgia, serif" font-size="11" font-style="italic" fill="#756F62">An inquiry into determinism, editorial beauty, and persistent memory under scale.</text>

  <!-- Drop Cap and Body Text Lines -->
  <!-- Decorative Drop Cap 'I' -->
  <rect x="280" y="176" width="32" height="38" fill="#283C32" rx="2" />
  <text x="296" y="204" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#FAF6ED" text-anchor="middle">I</text>

  <text x="322" y="190" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#2D2B26">n the engineering of long-form reading platforms, text is not merely arbitrary data</text>
  <text x="322" y="206" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#2D2B26">payloads; it represents an immutable covenant between writer and reader.</text>

  <text x="280" y="230" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#3A3832">When a system introduces transient state drift or uncoordinated caching invalidation, the</text>
  <text x="280" y="246" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#3A3832">intimacy of immersion is permanently fractured. By treating client state as an append-only</text>
  <text x="280" y="262" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#3A3832">deterministic journal, reading position synchronization achieves zero perceptible latency.</text>

  <!-- Highlight Quote Box -->
  <rect x="280" y="282" width="460" height="48" rx="2" fill="#EFE8D6" stroke="#DFD5BE" stroke-width="1" />
  <line x1="280" y1="282" x2="280" y2="330" stroke="#9A4D2E" stroke-width="3" />
  <text x="296" y="303" font-family="'Newsreader', Georgia, serif" font-size="10" font-style="italic" fill="#38342C">"Architecture that respects human cognition must build with determinism,</text>
  <text x="296" y="319" font-family="'Newsreader', Georgia, serif" font-size="10" font-style="italic" fill="#38342C">minimizing every superfluous layer between human thought and the printed word."</text>

  <!-- Further Text Lines -->
  <text x="280" y="354" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#3A3832">The underlying engine coordinates chunked EPUB streams over lightweight protocol buffers,</text>
  <text x="280" y="370" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#3A3832">enabling instantaneous search traversals across multi-volume literary compendiums.</text>

  <!-- Floating Typography Toolbar (bottom of canvas) -->
  <g transform="translate(380, 420)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#1C231F" filter="url(#cardShadow)" />
    <text x="22" y="21" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Aa</text>
    <line x1="42" y1="9" x2="42" y2="25" stroke="#2F3B34" stroke-width="1" />
    <circle cx="64" cy="17" r="7" fill="#FAF6ED" />
    <circle cx="86" cy="17" r="7" fill="#EADFBE" />
    <circle cx="108" cy="17" r="7" fill="#131A16" stroke="#3D4F45" stroke-width="1" />
    <line x1="128" y1="9" x2="128" y2="25" stroke="#2F3B34" stroke-width="1" />
    <text x="146" y="21" font-family="'Inter', sans-serif" font-size="9" fill="#9FB5A9">16px</text>
    <line x1="180" y1="9" x2="180" y2="25" stroke="#2F3B34" stroke-width="1" />
    <text x="200" y="21" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#E47438">SERIF</text>
    <circle cx="242" cy="17" r="3.5" fill="#99C9AB" />
  </g>
</svg>
