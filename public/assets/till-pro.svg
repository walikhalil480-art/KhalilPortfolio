<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <filter id="posShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <linearGradient id="tillHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2820" />
      <stop offset="100%" stop-color="#141E18" />
    </linearGradient>
  </defs>

  <!-- App Window Frame -->
  <rect x="0" y="0" width="800" height="520" rx="6" fill="#131B16" />

  <!-- Top App Header Bar -->
  <rect x="0" y="0" width="800" height="42" rx="6" fill="url(#tillHeaderGrad)" />
  <circle cx="20" cy="21" r="4" fill="#E47438" opacity="0.9" />
  <circle cx="34" cy="21" r="4" fill="#CBB682" opacity="0.6" />
  <circle cx="48" cy="21" r="4" fill="#4E6759" opacity="0.6" />

  <!-- Brand Title -->
  <text x="70" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">TILL<tspan fill="#E47438">PRO</tspan></text>
  <rect x="135" y="13" width="76" height="18" rx="2" fill="#203328" />
  <text x="173" y="25" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#99C9AB" text-anchor="middle">REGISTER 01</text>

  <!-- Store Indicator & Live Status -->
  <text x="400" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8FA498" text-anchor="middle">FLAGSHIP STORE // CENTRAL DISTRICT • OPERATOR: K. WALI</text>

  <rect x="680" y="12" width="104" height="20" rx="3" fill="#1E3025" stroke="#2D4636" stroke-width="1" />
  <circle cx="692" cy="22" r="3" fill="#48C774" />
  <text x="736" y="25" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#B5D4C3" text-anchor="middle">CLOUD SYNCED</text>

  <!-- Main Left Content Area: Catalog & POS Operations (width: 510) -->
  <g transform="translate(18, 54)">
    
    <!-- KPI Metrics Row -->
    <g>
      <!-- KPI 1 -->
      <rect x="0" y="0" width="154" height="52" rx="4" fill="#1A251F" stroke="#25352C" stroke-width="1" />
      <text x="14" y="20" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#758E80" letter-spacing="0.8">TODAY'S REVENUE</text>
      <text x="14" y="42" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">$8,492.50</text>
      <text x="140" y="40" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#48C774" text-anchor="end">+18.4%</text>

      <!-- KPI 2 -->
      <rect x="166" y="0" width="154" height="52" rx="4" fill="#1A251F" stroke="#25352C" stroke-width="1" />
      <text x="180" y="20" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#758E80" letter-spacing="0.8">TRANSACTIONS</text>
      <text x="180" y="42" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">148 Completed</text>

      <!-- KPI 3 -->
      <rect x="332" y="0" width="170" height="52" rx="4" fill="#1A251F" stroke="#25352C" stroke-width="1" />
      <text x="346" y="20" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#758E80" letter-spacing="0.8">ACTIVE INVENTORY</text>
      <text x="346" y="42" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#E47438">1,240 SKUs</text>
      <text x="490" y="40" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#758E80" text-anchor="end">0 Low</text>
    </g>

    <!-- Search & Filter Bar -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="502" height="34" rx="3" fill="#17221C" stroke="#283A30" stroke-width="1" />
      <!-- Search Icon -->
      <circle cx="18" cy="17" r="4.5" stroke="#758E80" stroke-width="1.5" fill="none" />
      <line x1="21.5" y1="20.5" x2="26" y2="25" stroke="#758E80" stroke-width="1.5" />
      <text x="36" y="21" font-family="'Inter', sans-serif" font-size="9.5" fill="#5F7569">Scan barcode or search products by title, SKU, category...</text>
      <rect x="444" y="6" width="50" height="22" rx="2" fill="#24372C" />
      <text x="469" y="20" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#8FA498" text-anchor="middle">SCAN [F2]</text>
    </g>

    <!-- Category Tabs -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="70" height="24" rx="2" fill="#E47438" />
      <text x="35" y="15" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ALL ITEMS</text>

      <rect x="76" y="0" width="80" height="24" rx="2" fill="#1A251F" />
      <text x="116" y="15" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#8FA498" text-anchor="middle">PROVISIONS</text>

      <rect x="162" y="0" width="70" height="24" rx="2" fill="#1A251F" />
      <text x="197" y="15" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#8FA498" text-anchor="middle">APPAREL</text>

      <rect x="238" y="0" width="80" height="24" rx="2" fill="#1A251F" />
      <text x="278" y="15" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#8FA498" text-anchor="middle">HARDWARE</text>

      <rect x="324" y="0" width="80" height="24" rx="2" fill="#1A251F" />
      <text x="364" y="15" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#8FA498" text-anchor="middle">CERAMICS</text>
    </g>

    <!-- Product Grid (6 cards) -->
    <g transform="translate(0, 146)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="158" height="142" rx="4" fill="#18231D" stroke="#25352C" stroke-width="1" />
        <rect x="8" y="8" width="142" height="70" rx="3" fill="#202F26" />
        <circle cx="79" cy="43" r="16" fill="#273C30" />
        <path d="M73 43h12M79 37v12" stroke="#4E6D5B" stroke-width="2" stroke-linecap="round" />
        <text x="12" y="96" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">Specialty Roast Beans</text>
        <text x="12" y="110" font-family="'Inter', sans-serif" font-size="8" fill="#758E80">SKU: PROV-049 • Stock: 42</text>
        <text x="12" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E47438">$24.00</text>
        <rect x="122" y="116" width="28" height="18" rx="2" fill="#24372C" />
        <text x="136" y="128" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="158" height="142" rx="4" fill="#18231D" stroke="#25352C" stroke-width="1" />
        <rect x="8" y="8" width="142" height="70" rx="3" fill="#202F26" />
        <rect x="62" y="30" width="34" height="26" rx="2" fill="#2B3F33" stroke="#445F4F" stroke-width="1" />
        <text x="12" y="96" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">Cast Iron Teapot</text>
        <text x="12" y="110" font-family="'Inter', sans-serif" font-size="8" fill="#758E80">SKU: CRM-102 • Stock: 18</text>
        <text x="12" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E47438">$85.00</text>
        <rect x="122" y="116" width="28" height="18" rx="2" fill="#24372C" />
        <text x="136" y="128" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(344, 0)">
        <rect x="0" y="0" width="158" height="142" rx="4" fill="#18231D" stroke="#25352C" stroke-width="1" />
        <rect x="8" y="8" width="142" height="70" rx="3" fill="#202F26" />
        <polygon points="79,28 92,54 66,54" fill="#2B3F33" stroke="#445F4F" stroke-width="1" />
        <text x="12" y="96" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">Architect Drafting Pen</text>
        <text x="12" y="110" font-family="'Inter', sans-serif" font-size="8" fill="#758E80">SKU: HDW-314 • Stock: 65</text>
        <text x="12" y="130" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#E47438">$38.50</text>
        <rect x="122" y="116" width="28" height="18" rx="2" fill="#24372C" />
        <text x="136" y="128" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>

      <!-- Bottom Mini Bar: Quick Actions -->
      <g transform="translate(0, 154)">
        <rect x="0" y="0" width="502" height="34" rx="3" fill="#15201A" stroke="#23342A" stroke-width="1" />
        <text x="16" y="21" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#758E80">SHORTCUTS:</text>
        <rect x="80" y="7" width="70" height="20" rx="2" fill="#1F2D25" />
        <text x="115" y="20" font-family="'Inter', sans-serif" font-size="8" fill="#99C9AB" text-anchor="middle">[F4] CUSTOM ITEM</text>
        <rect x="156" y="7" width="60" height="20" rx="2" fill="#1F2D25" />
        <text x="186" y="20" font-family="'Inter', sans-serif" font-size="8" fill="#99C9AB" text-anchor="middle">[F5] REFUND</text>
        <rect x="222" y="7" width="70" height="20" rx="2" fill="#1F2D25" />
        <text x="257" y="20" font-family="'Inter', sans-serif" font-size="8" fill="#99C9AB" text-anchor="middle">[F7] HOLD CART</text>
      </g>
    </g>

  </g>

  <!-- Right Drawer: Active Order & Checkout Register (x: 540, width: 242) -->
  <g transform="translate(538, 54)">
    <rect x="0" y="0" width="244" height="446" rx="4" fill="#18231D" stroke="#2B3D32" stroke-width="1" filter="url(#posShadow)" />

    <!-- Order Header -->
    <rect x="0" y="0" width="244" height="42" rx="4" fill="#1F2D25" />
    <text x="16" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">CURRENT SALE</text>
    <text x="16" y="34" font-family="'Inter', sans-serif" font-size="8" fill="#8FA498">ORD-2025-0891</text>
    <rect x="180" y="11" width="50" height="20" rx="2" fill="#283C32" />
    <text x="205" y="24" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#E47438" text-anchor="middle">TABLE 04</text>

    <!-- Cart Line Items -->
    <!-- Line 1 -->
    <g transform="translate(14, 56)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">Specialty Roast Beans</text>
      <text x="0" y="26" font-family="'Inter', sans-serif" font-size="8" fill="#758E80">2x × $24.00</text>
      <text x="216" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="end">$48.00</text>
      <line x1="0" y1="36" x2="216" y2="36" stroke="#223028" stroke-width="1" />
    </g>

    <!-- Line 2 -->
    <g transform="translate(14, 102)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">Cast Iron Teapot</text>
      <text x="0" y="26" font-family="'Inter', sans-serif" font-size="8" fill="#758E80">1x × $85.00</text>
      <text x="216" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="end">$85.00</text>
      <line x1="0" y1="36" x2="216" y2="36" stroke="#223028" stroke-width="1" />
    </g>

    <!-- Line 3 -->
    <g transform="translate(14, 148)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">Architect Drafting Pen</text>
      <text x="0" y="26" font-family="'Inter', sans-serif" font-size="8" fill="#758E80">2x × $38.50</text>
      <text x="216" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="end">$77.00</text>
      <line x1="0" y1="36" x2="216" y2="36" stroke="#223028" stroke-width="1" />
    </g>

    <!-- Financial Totals Summary -->
    <g transform="translate(14, 210)">
      <rect x="0" y="0" width="216" height="92" rx="3" fill="#131B16" stroke="#223028" stroke-width="1" />
      
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="8.5" fill="#758E80">Subtotal (3 items)</text>
      <text x="204" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="end">$210.00</text>

      <text x="12" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#758E80">Applicable Tax (8.25%)</text>
      <text x="204" y="42" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="end">$17.33</text>

      <line x1="12" y1="54" x2="204" y2="54" stroke="#24342A" stroke-width="1" />

      <text x="12" y="76" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">TOTAL AMOUNT</text>
      <text x="204" y="76" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#E47438" text-anchor="end">$227.33</text>
    </g>

    <!-- Fast Checkout Action Buttons -->
    <g transform="translate(14, 318)">
      <!-- Payment Methods -->
      <rect x="0" y="0" width="104" height="34" rx="2" fill="#203026" stroke="#2E4436" stroke-width="1" />
      <text x="52" y="21" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">CASH [F8]</text>

      <rect x="112" y="0" width="104" height="34" rx="2" fill="#203026" stroke="#2E4436" stroke-width="1" />
      <text x="164" y="21" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">CARD [F9]</text>

      <!-- Main Pay Button -->
      <rect x="0" y="44" width="216" height="42" rx="2" fill="#E47438" />
      <text x="108" y="70" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">PROCESS $227.33 &rarr;</text>
    </g>

    <!-- Receipt / Audit Footer -->
    <text x="122" y="432" font-family="'Inter', sans-serif" font-size="7.5" fill="#5F7569" text-anchor="middle">AUTO-PRINT RECEIPT • ENCRYPTED TRANSACTION</text>
  </g>
</svg>
